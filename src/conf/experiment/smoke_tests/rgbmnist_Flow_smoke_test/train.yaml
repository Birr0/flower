# @package _global_

defaults:
- /data/rgbmnist
- /trainer/gpu
- /logger/wandb
- /logger/csv
- /paths/default
- /hydra/default
- model
- sweeps
- meta
- _self_

hydra:
  sweeper:
    params:
      #++data.y_catalog.drop_variables: ${....sweeps.drop_variables.0} #, ${....sweeps.drop_variables.1}, ${....sweeps.drop_variables.2} #, ${....sweeps.drop_variables.3}, ${....sweeps.drop_variables.4}, ${....sweeps.drop_variables.5}, ${....sweeps.drop_variables.6}, ${....sweeps.drop_variables.7}, ${....sweeps.drop_variables.8}, ${....sweeps.drop_variables.9}, ${....sweeps.drop_variables.10}, ${....sweeps.drop_variables.11}, ${....sweeps.drop_variables.12}, ${....sweeps.drop_variables.13}, ${....sweeps.drop_variables.14}, ${....sweeps.drop_variables.15}
      +seed: ${....sweeps.seeds.0} #, ${....sweeps.seeds.1}, ${....sweeps.seeds.2}

data:
  loader:
    # Forked DataLoader workers (num_workers>0, torch's default 'fork' start
    # method) hang indefinitely on this machine, independent of CUDA state or
    # data source -- confirmed via isolation test outside Hydra/Lightning.
    # num_workers=0 runs the loader in-process and avoids the hang.
    num_workers: 0

trainer:
  max_epochs: 2
  limit_train_batches: 3
  limit_val_batches: 2

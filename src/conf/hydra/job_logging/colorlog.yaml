# Hydra job_logging handler configuration for colorlog

_target_: logging.StreamHandler
_converter_: all
stream: ext://sys.stdout
formatter:
  _target_: colorlog.ColoredFormatter
  _converter_: all
  format: "%(log_color)s%(levelname)s%(reset)s - %(message)s"
  log_colors:
    DEBUG: cyan
    INFO: green
    WARNING: yellow
    ERROR: red
    CRITICAL: red
